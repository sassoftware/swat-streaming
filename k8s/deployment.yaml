apiVersion: apps/v1
kind: Deployment
metadata:
  name: swat-streaming
  namespace: swat-streaming
  labels:
    app.kubernetes.io/name: swat-streaming
spec:
  # Keep at 1 unless your topic has multiple partitions AND you want
  # parallel consumption within the same consumer group.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: swat-streaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swat-streaming
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamer
          image: ghcr.io/your-org/swat-streaming:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: swat-streaming-config
          env:
            - name: KAFKA_SASL_USERNAME_FILE
              value: /etc/kafka/credentials/username
            - name: KAFKA_SASL_PASSWORD_FILE
              value: /etc/kafka/credentials/password
            - name: CAS_TOKEN_FILE
              value: /etc/cas/credentials/token
            # If using user/password instead of OAuth token, unset CAS_TOKEN_FILE
            # and set CAS_USERNAME_FILE + CAS_PASSWORD_FILE instead.
          volumeMounts:
            - name: kafka-creds
              mountPath: /etc/kafka/credentials
              readOnly: true
            - name: kafka-certs
              mountPath: /etc/kafka/certs
              readOnly: true
            - name: cas-creds
              mountPath: /etc/cas/credentials
              readOnly: true
            - name: cas-certs
              mountPath: /etc/cas/certs
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["python", "-c", "import socket,sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: kafka-creds
          secret:
            secretName: kafka-credentials
            items:
              - key: username
                path: username
              - key: password
                path: password
            defaultMode: 0400
        - name: kafka-certs
          secret:
            secretName: kafka-credentials
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
        - name: cas-creds
          secret:
            secretName: cas-credentials
            items:
              - key: token
                path: token
            defaultMode: 0400
        - name: cas-certs
          secret:
            secretName: cas-credentials
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
            defaultMode: 0444
