# EXAMPLE ONLY — never commit real secrets.
# Prefer External Secrets Operator, Sealed Secrets, or Vault Agent Injector for production.
# Create with:
#   kubectl -n swat-streaming create secret generic kafka-credentials \
#     --from-literal=username='svc-viya-consumer' \
#     --from-literal=password='REPLACE_ME' \
#     --from-file=ca.crt=./kafka-ca.crt
#   kubectl -n swat-streaming create secret generic cas-credentials \
#     --from-literal=token='REPLACE_ME_OAUTH_TOKEN' \
#     --from-file=ca-bundle.crt=./viya-ca-bundle.crt
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-credentials
  namespace: swat-streaming
type: Opaque
stringData:
  username: "svc-viya-consumer"
  password: "REPLACE_ME"
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_KAFKA_CLUSTER_CA
    -----END CERTIFICATE-----
---
apiVersion: v1
kind: Secret
metadata:
  name: cas-credentials
  namespace: swat-streaming
type: Opaque
stringData:
  # Provide EITHER token (preferred) OR username + password
  token: "REPLACE_ME_OAUTH_TOKEN"
  # username: "svc-viya-consumer"
  # password: "REPLACE_ME"
  ca-bundle.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_VIYA_CA
    -----END CERTIFICATE-----
